[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge0"
version = "0.1.0"
description = "edge0: streaming MoE inference framework — SSD expert offload, parallel LoRA, prerouter routing prediction. Backend-isolated (MLX now, more platforms coming)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "edge0 contributors" }]
keywords = ["mlx", "moe", "inference", "lora", "ssd-offload", "streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # NOTE: mlx/mlx-metal pinned to 0.30.6 on purpose.  0.30.4 and older
    # mis-gate the NAX matmul kernels on Apple A18/A18 Pro (silently wrong
    # numbers -> garbled output, issue #8); fixed upstream in 0.30.5
    # (ml-explore/mlx#3083, #3092).  Do not go to mlx>=0.31.2 yet: default
    # streams become thread-local and the pool-thread builds in
    # edge0/streaming/layer.py fail with "no Stream(gpu, N) in current
    # thread".  mlx-lm stays 0.31.0 (newer releases crash in decode).
    # mlx ships macOS and Linux wheels but none for Windows; gate it so
    # `pip install -e .` works there too (the CUDA backend does not need
    # it).  mlx-lm is pure Python but only useful next to mlx.
    "mlx==0.30.6; sys_platform != 'win32'",
    "mlx-metal==0.30.6; platform_system == 'Darwin'",
    "mlx-lm==0.31.0; sys_platform != 'win32'",
    "numpy>=1.24",
    "safetensors>=0.4",
    "tokenizers>=0.15",
    "psutil>=5.9",
    # Used directly by the framework (backends/*/io.py load_tokenizer,
    # engine/ling.py chat template); previously only reached the
    # environment transitively through mlx-lm.
    "transformers>=4.40",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
cuda = [
    # On Linux the PyPI wheel is a CUDA build.  On Windows install torch
    # first from https://download.pytorch.org/whl/cu128 (the PyPI wheel
    # there is CPU-only); pip then treats this requirement as satisfied.
    "torch>=2.5",
]
fetch = [
    "huggingface_hub>=0.23",
]

[project.scripts]
edge0 = "edge0.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: real-weight e2e tests (skip with -m 'not slow')",
]
addopts = "-m 'not slow'"
